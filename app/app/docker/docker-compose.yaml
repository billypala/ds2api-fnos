services:
  # init 容器：从包内模板复制 config.json 到 PKGVAR，解耦 fnOS install_callback 时序依赖
  init:
    image: alpine:3.20
    container_name: ds2api-init
    restart: "no"
    volumes:
      - "${TRIM_PKGVAR}:/data"
      - "${TRIM_APPDEST}/docker:/tmpl:ro"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data
        # 幂等：仅当 config.json 不存在时复制
        if [ ! -f /data/config.json ]; then
          cp /tmpl/config.example.json /data/config.json
        fi
        chmod 666 /data/config.json
        echo "ds2api init done"

  ds2api:
    image: ouqiting/ds2api:latest
    container_name: ds2api
    restart: always
    user: "0:0"
    # 代理桥（Mihomo 一号一 IP）的 SOCKS5 监听需直落宿主机，必须 host 网络
    network_mode: host
    volumes:
      - "${TRIM_PKGVAR}:/data"
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - PORT=${TRIM_SERVICE_PORT}
      - DS2API_CONFIG_PATH=/data/config.json
      # 管理台密钥：wizard 必填项直接注入（fnOS 将 wizard 值作为环境变量提供给应用服务）
      - DS2API_ADMIN_KEY=${ds2api_admin_key}
    depends_on:
      init:
        condition: service_completed_successfully
